const metricCatalog=[{"category": "用户活跃", "english": "DAU / Daily Active Users", "name": "日活跃用户数", "key": true, "definition": "统计自然日内，至少发生过一次有效使用行为的去重用户数；同一用户当日多次使用只计 1 人。"}, {"category": "用户活跃", "english": "DAU Rate / Daily Active User Rate", "name": "日活跃率", "key": false, "definition": "日活跃用户数（DAU）÷ 同项目截至当日的开通用户数 × 100%。分子、分母采用相同用户范围。"}, {"category": "用户覆盖", "english": "Enabled Users", "name": "开通用户数", "key": false, "definition": "截至统计日，自项目上线以来累计获得使用权限的去重用户数；同一用户多次开通只计 1 人。"}, {"category": "用户覆盖", "english": "Cumulative Unique Users", "name": "累计使用用户数", "key": false, "definition": "自项目上线至统计日，至少发生过一次有效使用行为的去重用户数；同一用户跨日、跨会话只计 1 人。"}, {"category": "用户覆盖", "english": "Cumulative Adoption Rate", "name": "累计使用率", "key": false, "definition": "截至统计日的累计使用用户数 ÷ 同口径开通用户数 × 100%。分子、分母使用同一项目、同一统计截止日及用户范围。"}, {"category": "用户留存", "english": "D7 Retention / Day 7 Retention Rate", "name": "7日留存率", "key": true, "definition": "基准日 D 的活跃用户中，在 D+7 当天再次有效使用的去重人数 ÷ 基准日 D 的活跃用户数 × 100%。D 不限首次使用日；仅展示 D+7 已结束的批次，不按后续 7 天内任意回访计算。"}, {"category": "使用深度", "english": "", "name": "有效会话数", "key": false, "definition": ""}, {"category": "使用深度", "english": "ASD / Average Session Duration", "name": "每次会话平均时长", "key": true, "definition": "统计期内已结束的有效会话总时长 ÷ 同期已结束的有效会话数。分子、分母采用同一批会话；单位：分钟/次。会话起止及空闲处理规则待埋点方案确认。"}, {"category": "性能表现", "english": "Avg. TTFT / Average Time to First Token", "name": "平均首字响应时长", "key": true, "definition": "同一批可统计成功请求中，前端呈现首个有效回答内容时间与用户发送指令时间之差的总和 ÷ 请求数；单位：秒。不将加载提示或“思考中”状态计为首字。"}, {"category": "性能表现", "english": "Avg. Full Response Time", "name": "平均完整响应时长", "key": false, "definition": "同一批可统计成功请求中，前端完整呈现回答的结束时间与用户发送指令时间之差的总和 ÷ 请求数；单位：秒。包含开始推理前等待、首字等待及后续生成过程。"}, {"category": "功能使用", "english": "Feature UV / Feature Unique Users", "name": "功能日使用人数", "key": false, "definition": "统计期内，至少有效使用过一次指定功能的去重用户数；同一用户在同一功能中使用多次只计 1 人。不同功能分别去重。"}, {"category": "功能使用", "english": "Feature User Share", "name": "功能日使用人数占比", "key": false, "definition": "统计期内指定功能的去重使用人数 ÷ 同项目同期活跃用户数 × 100%。分子、分母采用相同用户范围；同一用户可使用多个功能，各功能占比之和可能超过 100%。"}, {"category": "功能使用", "english": "Cumulative Feature Unique Users", "name": "功能累计使用人数", "key": false, "definition": "自指定功能上线至统计日，至少有效使用过一次该功能的去重用户数；同一用户跨日、跨会话只计 1 人。"}, {"category": "功能使用", "english": "Cumulative Feature User Share", "name": "功能累计使用人数占比", "key": false, "definition": "截至统计日，指定功能累计去重使用人数 ÷ 同项目、同用户范围的累计使用用户数 × 100%。分子、分母使用同一截止日；各功能分别统计，占比之和可能超过 100%。"}];
const definition=name=>metricCatalog.find(m=>m.name===name)?.definition||'指标口径待确认（《项目指标与统计口径》暂未填写）。';
const titles={entry:['指标数据维护',''],import:['指标数据批量导入','下载当前维度的模板，校验文件后按统计期间批量保存。'],history:['数据校验与修改记录','查看各项目在本浏览器中的保存记录和修改明细。'],sync:['云文档同步','查看云文档数据来源与同步状态。']};
const names={day:'日',week:'周',month:'月'},today='2026-10-30',storageKey='dashboard-maintenance-v1';
const state={view:'entry',project:'life',category:'coverage',period:'day',anchor:'2026-10-28',cutoff:'2026-10-28',drafts:{},dirty:false,errors:{},importRows:[],importErrors:[],importFile:'',historyQuery:''};
let store={records:[],history:[]},storageAvailable=true;
try{const s=localStorage.getItem(storageKey);if(s){const v=JSON.parse(s);if(Array.isArray(v.records)&&Array.isArray(v.history))store=v}}catch{storageAvailable=false}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=v=>JSON.parse(JSON.stringify(v));
const pretty=d=>d.replaceAll('-','.');
function parse(d){return new Date(d+'T12:00:00')}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function shift(d,n){const t=parse(d);t.setDate(t.getDate()+n);return dateKey(t)}
function monday(d){const t=parse(d);t.setDate(t.getDate()-(t.getDay()+6)%7);return dateKey(t)}
function rangeFor(cat){return{start:state.cutoff,end:state.cutoff}}
function metadata(){return metaOf(state.category)}
function recordKey(m){return [m.project,m.category,m.period,m.start,m.end,m.actualEnd].join('|')}
function savedCurrent(){return store.records.find(r=>r.key===recordKey(metadata()))}
function n(d,k){const v=d[k];return v===undefined||v===null||String(v).trim()===''?null:Number(v)}
function project(){return projects.find(p=>p.id===state.project)}
function configuredFunnelMetrics(pid){try{const settings=JSON.parse(localStorage.getItem('dashboard-settings-v2')||'{}');return(Array.isArray(settings.metrics)?settings.metrics:[]).filter(m=>m.dim==='漏斗指标'&&m.enabled!==false&&(m.projects||[]).includes(pid))}catch{return[]}}
function fields(cat,pid=state.project){if(cat==='funnel')return configuredFunnelMetrics(pid).map(m=>({id:m.id,label:m.name,code:m.code,unit:m.unit||'',kind:['人','次'].includes(m.unit)?'int':'decimal',help:m.definition||'指标口径待确认。'}));const make=(id,label,unit,kind='decimal')=>({id,label,unit,kind,help:definition(label)});if(cat==='activity')return[make('activeDay','日活跃用户数','人','int'),make('activeRateDay','日活跃率','%')];if(cat==='coverage')return[make('enabled','开通用户数','人','int'),make('cumulative','累计使用用户数','人','int'),make('rate','累计使用率','%')];if(cat==='retention')return[make('d7RetentionRate','7日留存率','%')];if(cat==='depth')return[make('completedSessionCount','有效会话数','次','int'),make('sessionDurationAvg','每次会话平均时长','分钟／次')];if(cat==='performance')return[make('ttftDay','平均首字响应时长','秒'),make('completeDay','平均完整响应时长','秒')];return projects.find(p=>p.id===pid).functions.flatMap((name,i)=>[make('f'+i+'Day',name+'·功能日使用人数','人','int'),make('f'+i+'ShareDay',name+'·功能日使用人数占比','%'),make('f'+i+'Cumulative',name+'·功能累计使用人数','人','int'),make('f'+i+'CumShare',name+'·功能累计使用人数占比','%')].map(f=>({...f,help:definition(f.label.split('·')[1])})))}

function validate(data,m,partial=false){const err={},fs=fields(m.category,m.project);if([m.start,m.end,m.actualEnd].some(d=>!/^\d{4}-\d{2}-\d{2}$/.test(d||'')||Number.isNaN(parse(d).getTime())||dateKey(parse(d))!==d))err['_all_'+m.category]='请填写有效的统计日期';for(const f of fs){const raw=String(data[f.id]??'').trim();if(!raw){if(!partial&&!(f.id==='sessionDurationAvg'&&n(data,'completedSessionCount')===0))err[f.id]='请填写'+f.label;continue}const valid=f.kind==='int'?(/^\d+$/.test(raw)&&Number.isSafeInteger(Number(raw))):/^\d+(\.\d{1,6})?$/.test(raw);if(!valid||!Number.isFinite(Number(raw)))err[f.id]=f.kind==='int'?'请输入非负整数':'请输入非负数，最多 6 位小数';else if(f.unit==='%'&&Number(raw)>100)err[f.id]='比例应在 0～100% 之间'}
if(m.category==='coverage'&&n(data,'cumulative')!==null&&n(data,'enabled')!==null&&n(data,'cumulative')>n(data,'enabled'))err.cumulative='累计使用人数不能超过开通用户数';
if(m.category==='performance'&&n(data,'ttftDay')!==null&&n(data,'completeDay')!==null&&n(data,'ttftDay')>n(data,'completeDay'))err.completeDay='完整响应时长不能小于首字响应时长';
if(m.category==='depth'&&n(data,'completedSessionCount')===0&&n(data,'sessionDurationAvg')!==null)err.sessionDurationAvg='有效会话数为 0 时，平均时长应留空';
if(m.category==='functions')projects.find(p=>p.id===m.project).functions.forEach((_,i)=>{const a=n(data,'f'+i+'Day'),b=n(data,'f'+i+'Cumulative');if(a!==null&&b!==null&&a>b)err['f'+i+'Day']='功能日使用人数不能超过累计使用人数'});
if(m.actualEnd>today)err['_all_'+m.category]='不能保存未来日期的数据';if(m.category==='retention'&&m.actualEnd>=today)err['_all_'+m.category]='仅可保存第7天观察日已结束的留存数据';if(m.start!==m.end||m.start!==m.actualEnd)err['_all_'+m.category]='统计开始日、结束日与数据截止日须一致';return err}

function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,4200)}
function persist(next){try{localStorage.setItem(storageKey,JSON.stringify(next));store=next;storageAvailable=true;return true}catch{toast('保存失败：当前浏览器无法写入本地存储，请检查存储权限或空间。');return false}}
function loadDraft(){state.drafts={};for(const cat of categories.map(c=>c[0])){const saved=store.records.find(r=>r.key===recordKey(metaOf(cat)));state.drafts[cat]=Object.fromEntries(fields(cat).filter(f=>saved?.data[f.id]!==undefined).map(f=>[f.id,saved.data[f.id]]))}state.dirty=false;state.errors={};state.importRows=[];state.importErrors=[];state.importFile=''}
function saveRecord(data,m,source='手工录入',target=store){const k=recordKey(m),old=target.records.find(r=>r.key===k),id='r'+Date.now()+Math.random().toString(36).slice(2,6),at=new Date().toLocaleString('zh-CN',{hour12:false});const rec={key:k,meta:clone(m),data:m.category==='funnel'?{...clone(old?.data||{}),...clone(data)}:clone(data),source,at,id:old?.id||id};target.records=target.records.filter(r=>r.key!==k);target.records.push(rec);target.history.unshift({id,at,key:k,meta:clone(m),before:old?.data||{},after:clone(data),source,action:old?'修改':'新增'});return rec}
function save(){state.errors={};let hasError=false;const next=clone(store);let savedCount=0;for(const cat of categories.map(c=>c[0])){if(cat==='functions'&&!project().functions.length)continue;const m=metaOf(cat),data=cat==='funnel'?Object.fromEntries(fields(cat).filter(f=>Object.hasOwn(draftOf(cat),f.id)).map(f=>[f.id,draftOf(cat)[f.id]])):draftOf(cat);if(!fields(cat).some(f=>String(data[f.id]??'').trim()!==''))continue;const err=validate(data,m);if(Object.keys(err).length){hasError=true;Object.assign(state.errors,err)}else if(Object.values(data).some(v=>String(v??'').trim()!=='')){saveRecord(data,m,'手工录入',next);savedCount++}}if(hasError){renderContent();const first=$('#errorBanner-'+categories.find(c=>state.errors['_all_'+c[0]]||Object.keys(state.errors).some(k=>fields(c[0]).some(f=>state.errors[f.id])))?.[0]);if(first)first.scrollIntoView({block:'center',behavior:'smooth'});return}if(persist(next)){state.dirty=false;drafts.clear();renderAll();toast(savedCount?`已保存 ${savedCount} 个维度到当前浏览器。`:'未填写任何数据。')}}
function draftOf(cat){return state.drafts[cat]??(state.drafts[cat]={})}
function fieldHtml(f,cat){const d=draftOf(cat);return `<div class="field ${state.errors[f.id]?'invalid':''}" id="wrap-${f.id}"><label class="field-label" for="input-${f.id}">${f.id==='sessionDurationAvg'&&n(d,'completedSessionCount')===0?'':'<span class="required">*</span>'}${esc(f.label)}${cat==='funnel'?`<small class="funnel-metric-code">${esc(f.code||'')}</small>`:''}${f.help?`<span class="help-tip" tabindex="0" data-tip="${esc(f.help)}">?</span>`:''}</label><div class="input-wrap"><input id="input-${f.id}" data-field="${f.id}" data-cat="${cat}" inputmode="${f.kind==='int'?'numeric':'decimal'}" value="${esc(d[f.id]??'')}" placeholder="${f.kind==='int'?'请输入人数或次数':'请输入数值'}" autocomplete="off" aria-describedby="error-${f.id}"><span class="input-unit">${esc(f.unit)}</span></div><div class="field-error" id="error-${f.id}">${esc(state.errors[f.id]||'')}</div></div>`}
function functionHtml(cat){if(!project().functions.length)return `<div class="empty-state">${icons.empty}<h3>该项目尚未配置功能清单</h3><p>配置完成后，可维护各功能的使用数据。</p></div>`;const d=draftOf(cat);const columns=[['Day','功能日使用人数','人'],['ShareDay','功能日使用人数占比','%'],['Cumulative','功能累计使用人数','人'],['CumShare','功能累计使用人数占比','%']];return `<div class="feature-entry"><table class="data-table"><thead><tr><th>功能</th>${columns.map(c=>`<th>${c[1]}（${c[2]}）<span class="help-tip" tabindex="0" data-tip="${esc(definition(c[1]))}">?</span></th>`).join('')}</tr></thead><tbody>${project().functions.map((name,i)=>`<tr><td>${esc(name)}</td>${columns.map(([suffix,label,unit])=>{const key='f'+i+suffix;return `<td><input data-field="${key}" data-cat="${cat}" aria-label="${name}·${label}" inputmode="${unit==='人'?'numeric':'decimal'}" placeholder="—" value="${esc(d[key]??'')}"><div class="field-error" id="error-${key}">${esc(state.errors[key]||'')}</div></td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="function-foot">日使用人数占比以当日活跃用户数为分母，累计使用人数占比以项目累计使用用户数为分母。各功能分别去重，占比之和可能超过 100%。</div>`}
function sectionHtml(cat){const descriptor=cat==='coverage'?'累计指标':cat==='retention'?'留存指标':'日指标';const hints={activity:'按所选自然日录入。',coverage:'截至所选统计日的累计数据。',retention:'基准日 '+pretty(shift(state.cutoff,-7))+' → 第7天观察日 '+pretty(state.cutoff),depth:'有效会话数口径待确认；平均时长单位：分钟／次。',performance:'同一批成功请求，均从发送指令开始计时。',functions:'录入当日及截至统计日的累计使用数据。',funnel:'按当前项目已启用的漏斗指标，维护所选统计日的数据。'};return `<section class="panel form-panel" data-section="${cat}"><div class="section-heading"><h2>${categories.find(x=>x[0]===cat)[1]}</h2><span class="tag">${descriptor}</span><span class="heading-hint">${hints[cat]}</span></div><div class="error-banner" id="errorBanner-${cat}">${state.errors['_all_'+cat]?esc(state.errors['_all_'+cat]):''}</div>${cat==='functions'?functionHtml(cat):cat==='funnel'&&!fields(cat).length?`<div class="funnel-metrics-empty">当前项目暂无已启用的漏斗指标，请先到<a href="Dashboard设置管理_PC_v1.html#metrics">指标配置</a>中新增并关联适用项目。</div>`:`<div class="fields">${fields(cat).map(f=>fieldHtml(f,cat)).join('')}</div>`}${cat==='retention'&&draftOf(cat).d7RetentionRate===undefined&&store.records.some(r=>r.meta.project===state.project&&r.meta.category==='retention'&&r.meta.actualEnd===state.cutoff&&r.data.retentionRate!==undefined)?'<div class="info-line">已有次周留存数据保留在历史记录中，请按7日留存口径重新维护。</div>':''}</section>`}

function formHtml(){return `<div class="entry-grid">${categories.map(c=>sectionHtml(c[0])).join('')}</div>`}
function metaOf(cat){const r=rangeFor(cat);const m={project:state.project,category:cat,period:cat==='coverage'?'cumulative':'day',anchor:state.cutoff,cutoff:state.cutoff,start:r.start,end:r.end,actualEnd:r.end};if(cat==='retention'){m.baselineDate=shift(r.end,-7);m.observationDate=r.end}return m}


function demoDataFor(projectIndex,dateIndex){const round=(v,n=1)=>Number(v.toFixed(n)),enabled=[75000,20000,10000][projectIndex],cumulative=[[50800,51000,51240,51525],[10830,10900,10960,11040],[4110,4160,4210,4260]][projectIndex][dateIndex],activeDay=Math.round([13102,3016,1186][projectIndex]*[.88,.94,.97,1][dateIndex]),date='2026-10-'+(25+dateIndex),i=11+dateIndex,series=[[10420,10960,10780,11320,10860,10120,10480,11560,11840,11620,12220,11960,12320,12846,13102],[2180,2260,2140,2340,2490,2310,2240,2380,2570,2460,2690,2810,2780,2968,3016],[760,810,790,850,870,820,840,910,920,890,970,1020,1080,1152,1186]][projectIndex],cohort=series[i-7],offset=3-dateIndex,target=[.688,.642,.605][projectIndex]-offset*.004+Math.sin(offset*1.1)*.002;const data={coverage:{enabled,cumulative,rate:round(cumulative/enabled*100)},activity:{activeDay,activeRateDay:round(activeDay/enabled*100)},depth:{completedSessionCount:Math.round(activeDay*(2.6+Math.sin(i*.65)*.2)),sessionDurationAvg:round([4.8,5.6,4.2][projectIndex]+(activeDay/series.at(-1)-1)*1.2+(Math.sin(i*.9)-Math.sin(14*.9))*.22)},performance:{ttftDay:round(1.18+projectIndex*.2+dateIndex*.02,2),completeDay:round(11.6+projectIndex*1.2+dateIndex*.3)},retention:{d7RetentionRate:round(Math.round(cohort*target)/cohort*100,6)},functions:{}};projects[projectIndex].functions.forEach((_,j)=>{const cum=Math.round((12000-j*1900)*[1,.23,.09][projectIndex]*(.96+dateIndex*.013)),users=Math.min(cum,Math.round(activeDay*(.38-j*.055)));Object.assign(data.functions,{['f'+j+'Day']:users,['f'+j+'ShareDay']:round(users/activeDay*100),['f'+j+'Cumulative']:cum,['f'+j+'CumShare']:round(cum/cumulative*100)})});return data}
function seedDemoData(){const next=clone(store);let added=0;projects.forEach((p,i)=>{for(let d=0;d<4;d++){const date='2026-10-'+(25+d),data=demoDataFor(i,d);for(const [cat] of categories){if(cat==='funnel')continue;if(cat==='functions'&&!p.functions.length)continue;const meta={project:p.id,category:cat,period:cat==='coverage'?'cumulative':'day',anchor:date,cutoff:date,start:date,end:date,actualEnd:date};if(cat==='retention'){meta.baselineDate=shift(date,-7);meta.observationDate=date}const old=next.records.find(r=>r.key===recordKey(meta));if(old){if(old.source!=='演示造数')continue;const missing=Object.fromEntries(Object.entries(data[cat]).filter(([k])=>old.data[k]===undefined));if(!Object.keys(missing).length)continue;saveRecord({...old.data,...missing},meta,'演示造数',next);added++;continue}if(Object.keys(validate(data[cat],meta)).length)throw Error('演示数据校验失败：'+p.id+' '+date+' '+cat);saveRecord(data[cat],meta,'演示造数',next);added++}}});if(added){store=next;try{localStorage.setItem(storageKey,JSON.stringify(next))}catch{storageAvailable=false}}return added}

function refreshState(){const saved=store.records.filter(r=>r.meta.project===state.project&&r.meta.actualEnd===state.cutoff),isDemo=saved.length&&saved.every(r=>r.source==='演示造数');$('#saveState').innerHTML=`<span class="status-dot ${state.dirty?'dirty':saved.length?'saved':''}"></span>${state.dirty?'有未保存的修改':isDemo?'演示数据 · '+project().name+' · '+pretty(state.cutoff):saved.length?'当前项目与日期已保存到本浏览器':'当前项目与统计日期尚无保存记录'}`}
function contextHtml(){return `<div class="project-switch" role="group" aria-label="切换项目">${projects.map(p=>`<button type="button" data-project-switch="${p.id}" class="${state.project===p.id?'active':''}" aria-pressed="${state.project===p.id}">${p.name}</button>`).join('')}</div><div class="date-switch"><label for="cutoff">统计日期</label><div class="date-stepper"><button type="button" id="prevDataDate" aria-label="前一天">${icons.arrow}</button><input id="cutoff" type="date" value="${state.cutoff}" max="${today}" aria-label="切换统计日期"><button type="button" id="nextDataDate" aria-label="后一天" ${state.cutoff>=today?'disabled':''}>${icons.arrow}</button></div></div>`}
function changeContext(mutator){if(state.dirty){stashDraft()}mutator();loadDraft();restoreDraft();renderAll()}
const drafts=new Map();function stashDraft(){for(const cat of categories.map(c=>c[0]))drafts.set(recordKey(metaOf(cat)),{data:clone(draftOf(cat))})}
function restoreDraft(){for(const cat of categories.map(c=>c[0])){const d=drafts.get(recordKey(metaOf(cat)));if(d){state.drafts[cat]=clone(d.data);state.dirty=true}}}
function bindContext(){$$('[data-project-switch]').forEach(button=>button.onclick=()=>{if(button.dataset.projectSwitch!==state.project)changeContext(()=>state.project=button.dataset.projectSwitch)});$('#cutoff').onchange=e=>{if(!e.target.value){e.target.value=state.cutoff;return}if(e.target.value>today){toast('不能选择未来日期。');e.target.value=state.cutoff;return}changeContext(()=>{state.cutoff=e.target.value;state.anchor=e.target.value})};$('#prevDataDate').onclick=()=>changeContext(()=>{state.cutoff=shift(state.cutoff,-1);state.anchor=state.cutoff});$('#nextDataDate').onclick=()=>{if(state.cutoff>=today)return;changeContext(()=>{state.cutoff=shift(state.cutoff,1);state.anchor=state.cutoff})}}
function bindImportDropdown(){const btn=$('#importBtn'),menu=$('#importMenu');btn.onclick=e=>{e.stopPropagation();menu.classList.toggle('open');btn.setAttribute('aria-expanded',menu.classList.contains('open'))};$('#menuTemplate').onclick=()=>{menu.classList.remove('open');btn.setAttribute('aria-expanded','false');downloadTemplate()};$('#menuUpload').onclick=()=>{menu.classList.remove('open');btn.setAttribute('aria-expanded','false');if(state.dirty){stashDraft()}location.hash='import'};document.addEventListener('click',e=>{if(menu.classList.contains('open')&&!btn.contains(e.target)){menu.classList.remove('open');btn.setAttribute('aria-expanded','false')}})}
function renderAll(){const t=titles[state.view];$('#pageTitle').textContent=t[0];$('#pageSubtitle').textContent=t[1];$('#breadcrumb').textContent='数据维护 / '+({entry:'指标录入',import:'批量导入',history:'校验与修改记录',sync:'云文档同步'}[state.view]);$$('[data-view]').forEach(a=>a.classList.toggle('active',a.dataset.view===state.view));$('#contextPanel').hidden=state.view==='sync';$('#contextGrid').innerHTML=contextHtml();if(state.view!=='sync')bindContext();$('#categoryTabs').hidden=true;$('#headingActions').innerHTML=state.view==='entry'?`<div class="dropdown" id="importDropdown"><button class="button" id="importBtn">数据导入<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="m6 9 6 6 6-6"/></svg></button><div class="dropdown-menu" id="importMenu"><button class="dropdown-item" id="menuTemplate">模板下载</button><button class="dropdown-item" id="menuUpload">数据上传</button></div></div><button class="button" id="syncBtn">云文档同步</button>`:state.view==='import'?'<button class="button" id="backEntry">返回录入</button>':state.view==='sync'?'<button class="button" id="backEntry">返回录入</button>':state.view==='history'?'<button class="button" id="backEntry">返回录入</button>':'';$('#savebar').hidden=state.view!=='entry';$('#save').innerHTML=icons.save+'保存数据';renderContent();refreshState();if($('#template'))$('#template').onclick=downloadTemplate;if($('#importBtn'))bindImportDropdown();if($('#syncBtn'))$('#syncBtn').onclick=()=>{if(state.dirty){stashDraft()}location.hash='sync'};if($('#backEntry'))$('#backEntry').onclick=()=>{location.hash='entry'}}
function renderContent(){$('#content').innerHTML=state.view==='entry'?formHtml():state.view==='import'?importHtml():state.view==='history'?historyHtml():syncHtml();if(state.view==='entry'){$$('[data-field]').forEach(input=>{input.oninput=()=>{const cat=input.dataset.cat;draftOf(cat)[input.dataset.field]=input.value;state.dirty=true;const partial=validate(draftOf(cat),metaOf(cat),true),error=partial[input.dataset.field]||'';const el=$('#error-'+input.dataset.field);if(el)el.textContent=error;input.closest('.field')?.classList.toggle('invalid',!!error)}})}if(state.view==='import')bindImport();if(state.view==='history')bindHistory()}
function fillSample(){const i=projects.findIndex(p=>p.id===state.project),d=Math.max(0,Math.min(3,Math.round((parse(state.cutoff)-parse('2026-10-25'))/86400000)));state.drafts=clone(demoDataFor(i,d));state.dirty=true;state.errors={};renderContent();toast('已填入演示样本，尚未保存。')}

function historyHtml(){let rows=store.history.filter(h=>h.meta.project===state.project&&h.meta.category===state.category);if(state.historyQuery)rows=rows.filter(h=>(h.at+' '+h.source+' '+h.meta.start).includes(state.historyQuery));return `<section class="panel history-panel"><div class="history-toolbar"><span>共 ${rows.length} 条修改记录</span><label class="field-label" for="historyCatSelect">维度</label><select id="historyCatSelect">${categories.map(([id,name])=>`<option value="${id}" ${state.category===id?'selected':''}>${name}</option>`).join('')}</select><input id="historySearch" placeholder="搜索日期或来源" value="${esc(state.historyQuery)}" aria-label="搜索修改记录"></div>${rows.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>保存时间</th><th>统计期间</th><th>操作</th><th>来源</th><th></th></tr></thead><tbody>${rows.map(h=>`<tr><td>${esc(h.at)}</td><td>${pretty(h.meta.start)}${h.meta.start!==h.meta.end?'–'+pretty(h.meta.end):''}</td><td><span class="chip">${h.action}</span></td><td>${h.source}</td><td><button class="text-button" data-history="${h.id}">查看明细</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty-state">${icons.empty}<h3>未找到匹配结果</h3><p>当前项目与维度尚无保存记录。</p></div>`}<div id="changeDetail"></div></section>`}
function bindHistory(){$('#historyCatSelect')&&($('#historyCatSelect').onchange=e=>{state.category=e.target.value;renderContent()});if($('#historySearch'))$('#historySearch').onchange=e=>{state.historyQuery=e.target.value;renderContent()};$$('[data-history]').forEach(b=>b.onclick=()=>{const h=store.history.find(h=>h.id===b.dataset.history);const legacyLabels={activeWeek:'周活跃用户数（旧指标）',activeMonth:'月活跃用户数（旧指标）',activeRateWeek:'周活跃率（旧指标）',activeRateMonth:'月活跃率（旧指标）',retentionRate:'次周留存率（旧口径）',sessionsDay:'日人均使用次数（旧指标）',sessionsWeek:'周人均使用次数（旧指标）',sessionsMonth:'月人均使用次数（旧指标）',turnsDay:'日人均对话轮次（旧指标）',turnsWeek:'周人均对话轮次（旧指标）',turnsMonth:'月人均对话轮次（旧指标）',responseDay:'日平均响应时长（旧指标）',responseWeek:'周平均响应时长（旧指标）',responseMonth:'月平均响应时长（旧指标）'};const current=fields(h.meta.category,h.meta.project),fs=[...current,...Array.from(new Set([...Object.keys(h.before),...Object.keys(h.after)])).filter(id=>!current.some(f=>f.id===id)).map(id=>({id,label:legacyLabels[id]||configuredFunnelMetrics(h.meta.project).find(m=>m.id===id)?.name||id+'（旧字段）'}))];$('#changeDetail').innerHTML=`<div class="change-detail"><h3>${esc(h.action)}明细 · ${esc(h.at)}</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>指标 / 基础数据</th><th>修改前</th><th>修改后</th></tr></thead><tbody>${fs.filter(f=>String(h.before[f.id]??'')!==String(h.after[f.id]??'')).map(f=>`<tr><td>${esc(f.label)}</td><td>${esc(h.before[f.id]??'—')}</td><td>${esc(h.after[f.id]??'—')}</td></tr>`).join('')}</tbody></table></div></div>`})}
function syncHtml(){return `<section class="panel sync-panel"><div class="sync-top"><div><h2>云文档数据来源</h2><p class="subtitle">为项目配置来源后，可查看同步结果及异常。</p></div><span class="tag gray">待配置</span></div><div class="sync-steps"><div class="sync-step"><strong>1. 确定文档平台</strong><p>腾讯文档、飞书或其他平台尚未确定。</p></div><div class="sync-step"><strong>2. 配置项目与字段</strong><p>建立项目、指标、统计周期的字段映射。</p></div><div class="sync-step"><strong>3. 同步与校验</strong><p>接入后展示同步状态和数据校验结果。</p></div></div><div class="notice">当前未连接云文档。可先通过手工录入或 CSV 导入维护数据。</div><div class="empty-state">${icons.sync}<h3>暂无同步任务</h3></div></section>`}
const csvEncode=v=>'"'+String(v??'').replaceAll('"','""')+'"';
function csvParse(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}if(quoted)throw Error('文件包含未闭合的引号');row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows}
function downloadTemplate(){if(!fields(state.category).length){toast('当前项目暂无可维护指标，请先到指标配置中添加。');return}const m=metaOf(state.category);const headers=['项目','维度','期间类型','统计开始日','统计结束日','数据截止日',...fields(state.category).map(f=>f.label)];const vals=[project().name,categories.find(c=>c[0]===state.category)[1],m.period,m.start,m.end,m.actualEnd,...fields(state.category).map(()=> '')];const content='\ufeff'+[headers,vals].map(row=>row.map(csvEncode).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));a.download=`${project().name}_${categories.find(c=>c[0]===state.category)[1]}_模板.csv`;a.click();URL.revokeObjectURL(a.href)}
function importHtml(){return `<section class="panel import-layout"><div class="section-heading"><h2>${categories.find(c=>c[0]===state.category)[1]} · 批量导入</h2><span class="tag gray">CSV</span></div><p class="form-hint">按当前项目与维度下载模板，可用 Excel 编辑后另存为 UTF-8 CSV。支持多个统计期间；已有同键记录默认跳过。</p><div class="import-cat"><label class="field-label" for="importCatSelect">维度</label><select id="importCatSelect">${categories.map(([id,name])=>`<option value="${id}" ${state.category===id?'selected':''}>${name}</option>`).join('')}</select></div><label class="upload-box">${icons.upload}<strong>${state.importFile?esc(state.importFile):'点击选择 CSV 文件'}</strong><small>单个文件不超过 2 MB，最多 1,000 条数据</small><input id="importFile" type="file" accept=".csv,text/csv" aria-label="选择 CSV 文件"></label><div class="import-actions"><div class="import-stat" id="importStat">${state.importRows.length?`校验通过 <strong>${state.importRows.length}</strong> 条，错误 <strong>${state.importErrors.length}</strong> 条`:'选择文件后先进行校验，确认后才保存。'}</div><button class="button primary" id="commitImport" ${!state.importRows.length?'disabled':''}>导入通过的数据</button></div>${state.importErrors.length?`<div class="error-banner">${state.importErrors.slice(0,8).map(esc).join('<br>')}</div>`:''}${state.importRows.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>项目</th><th>期间</th><th>数据截止日</th><th>处理</th></tr></thead><tbody>${state.importRows.map(r=>`<tr><td>${project().name}</td><td>${pretty(r.meta.start)}–${pretty(r.meta.end)}</td><td>${pretty(r.meta.actualEnd)}</td><td>${store.records.some(x=>x.key===recordKey(r.meta))?'已有记录，将跳过':'新增'}</td></tr>`).join('')}</tbody></table></div>`:''}</section>`}
function bindImport(){$$('#importCatSelect')&&($('#importCatSelect').onchange=e=>{state.category=e.target.value;state.importRows=[];state.importErrors=[];renderContent()});$('#importFile').onchange=async e=>{if(!fields(state.category).length){toast('当前项目暂无可维护指标，请先到指标配置中添加。');return}const file=e.target.files[0];if(!file)return;if(file.size>2*1024*1024){toast('文件超过 2 MB，请拆分后导入。');return}state.importFile=file.name;state.importRows=[];state.importErrors=[];try{const rows=csvParse(await file.text());if(rows.length<2)throw Error('文件没有数据行');if(rows.length>1001)throw Error('每次最多导入 1,000 条');const headers=rows[0];if(new Set(headers).size!==headers.length)throw Error('存在重复列名');const required=['项目','维度','期间类型','统计开始日','统计结束日','数据截止日',...fields(state.category).map(f=>f.label)];if(required.some(h=>!headers.includes(h)))throw Error('模板列不完整，请重新下载当前维度模板');const seen=new Set();for(let i=1;i<rows.length;i++){try{const obj=Object.fromEntries(headers.map((h,n)=>[h,rows[i][n]??'']));if(obj['项目']!==project().name||obj['维度']!==categories.find(c=>c[0]===state.category)[1])throw Error('项目或维度与当前选择不一致');const base=metaOf(state.category),m={...base,start:obj['统计开始日'],end:obj['统计结束日'],actualEnd:obj['数据截止日'],cutoff:obj['数据截止日'],period:obj['期间类型']};if([m.start,m.end,m.actualEnd].some(d=>!/^\d{4}-\d{2}-\d{2}$/.test(d)||Number.isNaN(parse(d).getTime())||dateKey(parse(d))!==d))throw Error('日期格式错误，应为 YYYY-MM-DD');if(m.period!==base.period)throw Error('期间类型与当前模板不一致');if(state.category==='coverage'&&(m.start!==m.end||m.start!==m.actualEnd))throw Error('累计快照的三个日期须一致');if(!['coverage'].includes(state.category)&&(m.start!==m.end||m.start!==m.actualEnd))throw Error('起止日应与数据截止日一致');if(state.category==='retention'){m.baselineDate=shift(m.actualEnd,-7);m.observationDate=m.actualEnd}const data=Object.fromEntries(fields(state.category).map(f=>[f.id,obj[f.label]]));const errors=validate(data,m);if(Object.keys(errors).length)throw Error(Object.values(errors).join('；'));const k=recordKey(m);if(seen.has(k))throw Error('文件内统计期间重复');seen.add(k);state.importRows.push({meta:m,data})}catch(err){state.importErrors.push(`第 ${i+1} 行：${err.message}`)}}}catch(err){state.importErrors.push(err.message)}renderContent()};$('#commitImport').onclick=()=>{const next=clone(store);let added=0,skipped=0;for(const r of state.importRows){if(next.records.some(x=>x.key===recordKey(r.meta))){skipped++;continue}saveRecord(r.data,r.meta,'CSV 导入',next);added++}if(persist(next)){state.importRows=[];renderContent();toast(`已导入 ${added} 条，跳过已有记录 ${skipped} 条。`)}}}
function route(){const view=location.hash.slice(1);if(!Object.hasOwn(titles,view)){location.hash='entry';return}if(state.view==='entry'&&state.dirty)stashDraft();state.view=view;if(view==='entry'){loadDraft();restoreDraft()}renderAll()}
$('#save').onclick=save;window.addEventListener('storage',e=>{if(e.key==='dashboard-settings-v2'){if(state.dirty)stashDraft();loadDraft();restoreDraft();renderAll()}});window.addEventListener('hashchange',route);window.addEventListener('beforeunload',e=>{if(state.dirty){e.preventDefault();e.returnValue=''}});seedDemoData();loadDraft();if(!location.hash)location.hash='entry';else route();
</script></body></html>

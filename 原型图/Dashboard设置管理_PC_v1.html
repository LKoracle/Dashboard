function nextMetricCode(dim){const prefix=metricPrefixes[dim];if(!prefix)throw Error('未配置该类型的编码前缀');let seq=Number(state.metricCodeCounters?.[prefix])||0;for(const m of state.metrics){const match=String(m.code||'').match(/^([A-Z]+)(\d+)$/);if(match&&match[1]===prefix)seq=Math.max(seq,Number(match[2]))}return prefix+String(seq+1).padStart(4,'0')}
function allocateMetricCode(dim){const code=nextMetricCode(dim),prefix=metricPrefixes[dim];state.metricCodeCounters??={};state.metricCodeCounters[prefix]=Number(code.slice(prefix.length));return code}
function initializeMetricCodes(){state.metricCodeCounters??={};const used=new Set();let changed=false;for(const m of state.metrics){if(!m.code||used.has(m.code)){m.code=allocateMetricCode(m.dim);changed=true}used.add(m.code)}if(changed){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch{}}}

function seedMetricProjects(){if(!state.projects.length)return;const used=new Set(),pending=[];let changed=false;state.metrics.forEach((m,i)=>{const ids=m.projects||[],valid=ids.length===1&&state.projects.some(p=>p.id===ids[0]),key=valid?metricNameProjectKey(m.name,ids[0]):null;if(valid&&!used.has(key))used.add(key);else pending.push({m,i})});for(const {m,i} of pending){const candidates=state.projects.map((_,n)=>state.projects[(i+n)%state.projects.length]);const target=candidates.find(p=>!used.has(metricNameProjectKey(m.name,p.id)));if(!target)continue;m.projects=[target.id];used.add(metricNameProjectKey(m.name,target.id));changed=true}if(changed){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch{}}}
function alignMetricCatalog(){const version="c79e9491f54b";if(state.metricCatalogVersion===version)return;const retired=new Set(['wau','mau','activeRateWeek','activeRateMonth','sessionsDay','sessionsWeek','sessionsMonth','turnsDay','turnsWeek','turnsMonth','funcWeek','funcMonth','funcShareWeek','funcShareMonth','responseDay','responseWeek','responseMonth','ttftWeek','ttftMonth','completeWeek','completeMonth']),used=new Set();state.metricConfigArchive??=[];const result=[];for(const item of state.metrics){if(retired.has(item.id)){state.metricConfigArchive.push({...clone(item),archivedReason:'已按项目指标与统计口径移出指标清单',catalogVersion:version});continue}const def=metricDefs.find(d=>d.id===item.id||d.name===item.name);if(!def){result.push(item);continue}used.add(def.id);result.push({...item,...def,id:item.id,code:item.code,projects:clone(item.projects||[]),enabled:item.enabled!==false,beidouMetric:item.beidouMetric||''})}for(const [i,def] of metricDefs.entries()){if(used.has(def.id))continue;const project=state.projects[i%state.projects.length];result.push({...def,projects:project?[project.id]:[],enabled:true})}state.metrics=result;state.metricCatalogVersion=version;try{localStorage.setItem(storageKey,JSON.stringify(state))}catch{}}

function openMetricModal(id){const m=id?state.metrics.find(x=>x.id===id):null;const isNew=!m;modalState={type:'metric',data:{id:m?.id||null,code:m?.code||'',dim:m?.dim||dims[0],name:m?.name||'',english:m?.english||'',unit:m?.unit||units[0],primary:m?.primary===true,period:m?.type==='cumulative'?'累计':m?.period||'日',definition:m?.definition||'',beidouMetric:m?.beidouMetric||'',projects:clone(m?.projects||[])}};const d=modalState.data;const dimOpts=dims.map(x=>`<option value="${x}" ${d.dim===x?'selected':''}>${x}</option>`).join('');const unitOpts=units.map(u=>`<option value="${u}" ${d.unit===u?'selected':''}>${u}</option>`).join('');const periodOptsHtml=['累计',...periodOpts].map(pp=>`<option value="${pp}" ${d.period===pp?'selected':''}>${pp}</option>`).join('');showModal(`<h3>${isNew?'新增指标':'编辑指标'}</h3>`,`<div class="field"><label for="m-code">指标编码</label><input type="text" id="m-code" value="${esc(d.code||nextMetricCode(d.dim))}" readonly aria-readonly="true" style="background:#f8fafc;color:#64748b"><div class="muted" style="font-size:11px;margin-top:5px">${isNew?'系统自动生成，保存时分配编码。':'系统生成，保存后编码保持不变。'}</div></div><div class="field" id="f-mname"><label><span class="req">*</span>指标名称</label><input type="text" id="m-mname" value="${esc(d.name)}"><div class="err">请填写指标名称</div></div><div class="field"><label for="m-english">英文缩写／名称</label><input type="text" id="m-english" value="${esc(d.english)}" placeholder="待确认时可留空"></div><div class="field"><label>统计口径</label><textarea id="m-def" placeholder="口径待确认时可留空">${esc(d.definition)}</textarea>${!d.definition?'<div class="muted" style="font-size:11px;margin-top:5px">原表暂未填写指标口径，待确认后补充。</div>':''}</div><div class="grid2"><div class="field"><label>类型</label><select id="m-dim">${dimOpts}</select></div><div class="field"><label>单位</label><select id="m-unit">${unitOpts}</select></div></div><div class="field" id="f-period"><label><span class="req">*</span>期间类型</label><select id="m-period">${periodOptsHtml}</select></div><div class="grid2"> function saveMetric(){const d=modalState.data;const name=$('#m-mname').value.trim();if(!name){$('#f-mname .err').textContent='请填写指标名称';$('#f-mname').classList.add('invalid');return}$('#f-mname').classList.remove('invalid');d.name=name;d.dim=$('#m-dim').value;d.period=$('#m-period').value;d.mtype=d.period==='累计'?'cumulative':'period';if(d.mtype==='cumulative')d.period=null;d.unit=$('#m-unit').value;d.definition=$('#m-def').value.trim();d.english=$('#m-english').value.trim();d.beidouMetric=$('#m-beidou').value.trim();const projectId=$('#m-project').value;if(!state.projects.some(p=>p.id===projectId)){$('#f-mproject').classList.add('invalid');return}if(metricNameExists(name,projectId,d.id)){$('#f-mname .err').textContent='该项目已存在同名指标，请修改指标名称或选择其他项目';$('#f-mname').classList.add('invalid');return}d.projects=[projectId];const before=clone(state);const payload={name:d.name,dim:d.dim,type:d.mtype,period:d.period,unit:d.unit,definition:d.definition,english:d.english,definitionPending:!d.definition,beidouMetric:d.beidouMetric,projects:d.projects,primary:d.primary};if(d.id){const m=state.metrics.find(x=>x.id===d.id);Object.assign(m,payload)}else{state.metrics.push({id:uid('m'),code:allocateMetricCode(d.dim),...payload,enabled:true,showTrend:false})}if(!persist()){state=before;return}closeModal();render();toast('已保存')}

function moveFunnelStep(from,to){if(!funnelProjectSelected()||!Number.isInteger(from)||!Number.isInteger(to)||from<0||to<0||from>=funnelEditor.stages.length||to>=funnelEditor.stages.length||from===to)return false;const [step]=funnelEditor.stages.splice(from,1);funnelEditor.stages.splice(to,0,step);funnelEditor.errors={};clearFunnelStepDrag();render();$('#funnel-step-drag-'+to)?.focus();return true}

e cx="11" cy="5" r="1.5"/><circle cx="5" cy="10" r="1.5"/><circle cx="11" cy="10" r="1.5"/><circle cx="5" cy="15" r="1.5"/><circle cx="11" cy="15" r="1.5"/></svg></button><span class="step-number">${i+1}</span></div></td><td><label class="sr-only" for="funnel-step-name-${i}">步骤 ${i+1} 名称</label><input type="text" id="funnel-step-name-${i}" data-step-name="${i}" value="${esc(step.name)}" placeholder="请输入步骤名称">${err['name'+i]?`<div class="funnel-field-error">${esc(err['name'+i])}</div>`:''}</td><td><label class="sr-only" for="funnel-step-metric-${i}">步骤 ${i+1} 指标</label><select id="funnel-step-metric-${i}" data-step-metric="${i}"><option value="">${step.metricId&&!metrics.some(m=>m.id===step.metricId)?'原指标已停用或不适用，请重新选择':'请选择指标'}</option>${metrics.map(m=>`<option value="${esc(m.id)}" ${step.metricId===m.id?'selected':''}>${esc(m.name)}（${esc(m.unit)}）.${esc(m.code)}</option>`).join('')}</select>${err['metric'+i]?`<div class="funnel-field-error">${esc(err['metric'+i])}</div>`:''}</td><td><button type="button" class="icon-btn" data-step-remove="${i}" aria-label="删除步骤 ${i+1}" title="删除步骤">${icons.trash}</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="funnel-steps-empty">暂无步骤，点击“添加步骤”开始配置。</div>'}</fieldset></section><div class="funnel-editor-actions"><button class="button" id="cancelFunnelEditor">取消</button><button class="button primary" id="saveFunnelEditor">保存漏斗</button></div>`}

function normalizeRolePermissions(role){const menus=new Set((role?.menus||[]).filter(id=>menuDefs.some(m=>m.id===id))),old=role?.opts||[],opts=new Set();for(const m of menuDefs){if(m.parent&&menus.has(m.parent)&&old.includes(m.name))menus.add(m.id);for(const o of m.opts){const key=m.id+':'+o;if(old.includes(key)||(menus.has(m.id)&&(old.includes(o)||(m.id==='maintain'&&o==='编辑'&&old.includes('录入修改'))))){menus.add(m.id);opts.add(key)}}}for(const id of [...menus]){let m=menuDefs.find(x=>x.id===id);while(m?.parent){menus.add(m.parent);m=menuDefs.find(x=>x.id===m.parent)}}return{menus:[...menus],opts:[...opts]}}

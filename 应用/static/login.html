<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登录 · 多项目指标看板</title><link rel="stylesheet" href="/dashboard/assets/style.css"><script src="/dashboard/assets/login.js" defer></script></head><body class="login-page"><main class="login-shell"><section class="login-brand"><div class="brand-mark">▥</div><p class="eyebrow">DASHBOARD</p><h1>多项目指标看板</h1><p class="brand-description">让每个项目的进展<br>都有清晰的数据依据。</p><div class="brand-lines" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span class="brand-foot">项目数据 · 统一管理</span></section><section class="login-form-section"><div class="login-heading"><p class="eyebrow">欢迎回来</p><h2>登录看板</h2><p>请使用你的账号登录</p></div><form id="loginForm"><label for="loginId">用户 ID</label><input id="loginId" name="username" autocomplete="username" maxlength="100" placeholder="请输入用户 ID" required><label for="password">密码</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" placeholder="请输入密码" required><button type="button" id="showPassword" aria-label="显示密码">显示</button></div><p id="error" class="form-error" role="alert"></p><button id="submitLogin" class="primary login-submit" type="submit">登录</button></form><p class="login-foot">仅限授权用户访问</p></section></main></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首页 · 多项目指标看板</title><link rel="stylesheet" href="/dashboard/assets/home.css"><script src="/dashboard/assets/home-charts.js" defer></script><script src="/dashboard/assets/home.js" defer></script></head><body>
<header class="topbar"><a class="brand" href="/dashboard/"><span class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V9m8 11V4m8 16V12M2 20h20"/></svg></span>多项目指标看板</a><nav aria-label="主导航"><a class="active" href="/dashboard/" aria-current="page">首页</a><a href="/dashboard/maintain">数据维护</a><a href="/dashboard/settings/menus">设置管理</a></nav><button id="logout" class="date-trigger">退出登录</button></header>
<main class="page"><p id="homeStatus" role="status"></p><section class="intro"><h1>项目运行概览</h1></section><section class="controls"><div id="projectTabs" class="project-tabs" role="tablist" aria-label="选择项目"></div><div class="date-controls"><span>统计日期</span><div class="date-shell" id="dateShell"><div class="date-input-row"><button class="date-step" id="prevDate" aria-label="前一天"></button><button id="dateTrigger" class="date-trigger" aria-label="选择统计日期" aria-haspopup="dialog" aria-expanded="false" aria-controls="calendar"><span id="dateText"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 11h16"/></svg></button><button class="date-step" id="nextDate" aria-label="后一天"></button></div><section id="calendar" class="calendar" role="dialog" aria-label="选择统计日期" hidden><div class="calendar-header"><button data-calendar-nav="-12" aria-label="上一年"></button><button data-calendar-nav="-1" aria-label="上个月"></button><strong id="calendarTitle"></strong><button data-calendar-nav="1" aria-label="下个月"></button><button data-calendar-nav="12" aria-label="下一年"></button></div><div class="calendar-body"><div class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="calendarDays" class="calendar-days"></div></div><div class="calendar-footer"><button id="calendarReset">重置</button><button id="calendarNow">现在</button><button id="calendarConfirm">确定</button></div></section></div></div></section><section class="dashboard" id="dashboardPanel" role="tabpanel" aria-label="项目指标"><section class="kpis" id="kpis" aria-label="关键指标"></section><section class="chart-panel" aria-labelledby="chartTitle"><div class="chart-heading"><h2 id="chartTitle">日活跃人数趋势<span>DAU TREND</span></h2><div class="chart-meta"><span class="chart-period" id="chartPeriod"></span></div></div><div class="chart-plot" id="chartPlot"></div></section><section class="coverage" aria-label="用户覆盖"><div class="coverage-heading"><h2>用户覆盖</h2><div id="coverageDate"></div></div><div class="coverage-items" id="coverageItems"></div></section><section class="chart-panel retention-panel" aria-labelledby="retentionTitle"><div class="chart-heading"><h2 id="retentionTitle">7日留存率趋势<span>D7 RETENTION</span></h2><div class="chart-meta"><span class="chart-period" id="retentionPeriod"></span></div></div><div class="chart-plot" id="retentionPlot"></div></section><div class="trend-pair"><section class="chart-panel session-panel" aria-labelledby="sessionTitle"><div class="chart-heading"><h2 id="sessionTitle">使用深度趋势</h2><div class="chart-meta"><span class="chart-period" id="sessionPeriod"></span></div></div><div class="session-legend"><span><i class="session-line-key"></i>每次会话平均时长（分钟／次）</span><span><i class="session-bar-key"></i>有效会话数（次）</span></div><div class="chart-plot" id="sessionPlot"></div></section><section class="chart-panel performance-panel" aria-labelledby="performanceTitle"><div class="chart-heading"><h2 id="performanceTitle">性能表现趋势</h2><div class="chart-meta"><span class="chart-period" id="performancePeriod"></span></div></div><div class="session-legend performance-legend"><span><i class="performance-first-key"></i>平均首字响应时长</span><span><i class="performance-full-key"></i>平均完整响应时长</span></div><div class="chart-plot" id="performancePlot"></div></section></div><section class="chart-panel feature-panel" aria-labelledby="featureTitle"><div class="chart-heading"><h2 id="featureTitle">功能使用</h2><div class="chart-meta"><span id="featureDate"></span></div></div><div id="featureContent" class="feature-content"></div></section><div class="funnel-pair" id="funnelCards"></div></section></main>
<aside class="definition" id="definition" role="note" hidden><h3 id="definitionTitle"></h3><p id="definitionText"></p></aside>
</body></html>

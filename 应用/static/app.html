<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>多项目指标看板</title><link rel="stylesheet" href="/dashboard/assets/style.css"><script src="/dashboard/assets/app.js" defer></script></head><body><header class="topbar"><a class="brand" href="/dashboard/"><span class="logo" aria-hidden="true">▥</span>多项目指标看板</a><nav id="topNav" aria-label="主导航"></nav><div class="account"><span id="accountName"></span><button id="logout" class="text-button">退出登录</button></div></header><aside id="sidebar" hidden><p class="side-heading">设置管理</p><nav id="sideNav" aria-label="设置管理导航"></nav><p class="side-foot">项目数据与系统配置<br>统一管理，按权限访问</p></aside><main id="content" class="page"><p>正在加载…</p></main><div id="toast" role="status" hidden></div><dialog id="confirmDialog"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="dialog-actions"><button id="cancelChange" class="secondary">取消</button><button id="confirmChange" class="primary">确认</button></div></dialog><dialog id="roleDialog"><div class="dialog-head"><h2 id="roleFormTitle">新增角色</h2><button type="button" id="roleClose" class="icon-btn" aria-label="关闭">✕</button></div><div class="dialog-body"><form method="dialog" onsubmit="return false"><label for="roleName"><span class="req">*</span>角色名称</label><input id="roleName" type="text" maxlength="100"><div id="roleNameErr" class="form-error" hidden>请填写角色名称</div><label>状态</label><div class="switch-row"><button type="button" class="switch" id="roleEnabled" role="switch" aria-checked="true" aria-label="启用状态"></button><span id="roleEnabledText">启用</span></div><label>菜单与操作权限</label><div id="rolePermTree" class="perm-tree"></div><label>可访问项目范围</label><div id="roleProjects" class="role-project-checkboxes"></div></form></div><div class="dialog-actions"><button id="roleCancel" class="secondary">取消</button><button id="roleSave" class="primary">保存</button></div></dialog><dialog id="projectDialog"><div class="dialog-head"><h2 id="projectFormTitle">新增项目</h2><button type="button" id="projectClose" class="icon-btn" aria-label="关闭">✕</button></div><div class="dialog-body"><form method="dialog" onsubmit="return false"><label for="projectName"><span class="req">*</span>项目名称</label><input id="projectName" type="text" maxlength="100" placeholder="如：寿险万能营销"><div id="projectNameErr" class="form-error" hidden>请填写项目名称</div><label>功能清单</label><div id="projectFnList" class="func-list"></div><div class="fn-input-row"><input id="projectFnInput" type="text" maxlength="50" placeholder="输入功能名称后回车添加"><button type="button" id="projectFnAdd" class="secondary">添加</button></div><label>状态</label><div class="switch-row"><button type="button" class="switch" id="projectEnabled" role="switch" aria-checked="true" aria-label="启用状态"></button><span id="projectEnabledText">启用</span></div></form></div><div class="dialog-actions"><button id="projectCancel" class="secondary">取消</button><button id="projectSave" class="primary">保存</button></div></dialog></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>多项目指标看板</title><link rel="stylesheet" href="/dashboard/assets/style.css"><script src="/dashboard/assets/app.js" defer></script></head><body><header class="topbar"><a class="brand" href="/dashboard/"><span class="logo" aria-hidden="true">▥</span>多项目指标看板</a><nav id="topNav" aria-label="主导航"></nav><div class="account"><span id="accountName"></span><button id="logout" class="text-button">退出登录</button></div></header><aside id="sidebar" hidden><nav id="sideNav" aria-label="设置管理导航"></nav><p class="side-foot">项目数据与系统配置<br>统一管理，按权限访问</p></aside><main id="content" class="page"><p>正在加载…</p></main><div id="toast" role="status" hidden></div><dialog id="confirmDialog"><div class="dialog-head"><h2 id="confirmTitle"></h2></div><div class="dialog-body"><p id="confirmText"></p></div><div class="dialog-actions"><button id="cancelChange" class="secondary">取消</button><button id="confirmChange" class="primary">确认</button></div></dialog><dialog id="roleDialog"><div class="dialog-head"><h2 id="roleFormTitle">新增角色</h2><button type="button" id="roleClose" class="icon-btn" aria-label="关闭">✕</button></div><div class="dialog-body"><form method="dialog" onsubmit="return false"><label for="roleName"><span class="req">*</span>角色名称</label><input id="roleName" type="text" maxlength="100"><div id="roleNameErr" class="form-error" hidden>请填写角色名称</div><label>状态</label><div class="switch-row"><button type="button" class="switch" id="roleEnabled" role="switch" aria-checked="true" aria-label="启用状态"></button><span id="roleEnabledText">启用</span></div><label>菜单与操作权限</label><div id="rolePermTree" class="perm-tree"></div><label>可访问项目范围</label><div id="roleProjects" class="role-project-checkboxes"></div></form></div><div class="dialog-actions"><button id="roleCancel" class="secondary">取消</button><button id="roleSave" class="primary">保存</button></div></dialog><dialog id="projectDialog"><div class="dialog-head"><h2 id="projectFormTitle">新增项目</h2><button type="button" id="projectClose" class="icon-btn" aria-label="关闭">✕</button></div><div class="dialog-body"><form method="dialog" onsubmit="return false"><label for="projectName"><span class="req">*</span>项目名称</label><input id="projectName" type="text" maxlength="100" placeholder="如：寿险万能营销"><div id="projectNameErr" class="form-error" hidden>请填写项目名称</div><label>功能清单</label><div id="projectFnList" class="func-list"></div><div class="fn-input-row"><input id="projectFnInput" type="text" maxlength="50" placeholder="输入功能名称后回车添加"><button type="button" id="projectFnAdd" class="secondary">添加</button></div><label>状态</label><div class="switch-row"><button type="button" class="switch" id="projectEnabled" role="switch" aria-checked="true" aria-label="启用状态"></button><span id="projectEnabledText">启用</span></div></form></div><div class="dialog-actions"><button id="projectCancel" class="secondary">取消</button><button id="projectSave" class="primary">保存</button></div></dialog><dialog id="userDialog"><div class="dialog-head"><h2 id="userFormTitle">新增用户</h2><button type="button" id="userClose" class="icon-btn" aria-label="关闭">✕</button></div><div class="dialog-body"><form method="dialog" onsubmit="return false"><label for="userName"><span class="req">*</span>用户名称</label><input id="userName" type="text" maxlength="100"><div id="userNameErr" class="form-error" hidden>请填写用户名称</div><label for="userAccount"><span class="req">*</span>用户ID</label><input id="userAccount" type="text" maxlength="100" placeholder="登录使用的账号"><div id="userAccountErr" class="form-error" hidden>请填写用户ID</div><label>分配角色</label><div class="user-role-control" id="userRoleControl"><button type="button" id="userRoleTrigger" class="user-role-trigger" aria-expanded="false" aria-controls="userRoleDropdown"><span id="userRoleTriggerText">请选择角色</span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div class="user-role-dropdown" id="userRoleDropdown" hidden><div class="user-role-toolbar"><input type="search" id="userRoleSearch" placeholder="搜索角色名称" aria-label="搜索角色名称"></div><div id="userRoleOptions" class="user-role-options"></div></div><div id="userRoleSelected" class="user-role-selected" aria-live="polite"></div></div><label>状态</label><div class="switch-row"><button type="button" class="switch" id="userEnabled" role="switch" aria-checked="true" aria-label="启用状态"></button><span id="userEnabledText">启用</span></div></form></div><div class="dialog-actions"><button id="userCancel" class="secondary">取消</button><button id="userSave" class="primary">保存</button></div></dialog><dialog id="metricDialog"><div class="dialog-head"><h2 id="metricFormTitle">新增指标</h2><button type="button" id="metricClose" class="icon-btn" aria-label="关闭">✕</button></div><div class="dialog-body"><form method="dialog" onsubmit="return false"><label for="metricCode">指标编码</label><input id="metricCode" type="text" readonly aria-readonly="true"><div class="muted code-hint" id="metricCodeHint">系统自动生成，保存时分配编码。</div><label for="metricName"><span class="req">*</span>指标名称</label><input id="metricName" type="text" maxlength="100"><div id="metricNameErr" class="form-error" hidden>请填写指标名称</div><label for="metricEnglish">英文缩写／名称</label><input id="metricEnglish" type="text" maxlength="200" placeholder="待确认时可留空"><label for="metricDef">统计口径</label><textarea id="metricDef" maxlength="2000" placeholder="口径待确认时可留空"></textarea><div class="grid2"><div><label for="metricDim">类型</label><select id="metricDim"></select></div><div><label for="metricUnit">单位</label><select id="metricUnit"><option>人</option><option>%</option><option>次</option><option>分钟／次</option><option>秒</option></select></div></div><div class="grid2"><div><label for="metricProject"><span class="req">*</span>适用项目</label><select id="metricProject"><option value="">请选择项目</option></select><div id="metricProjectErr" class="form-error" hidden>请选择一个项目</div></div><div><label for="metricBeidou">关联北斗指标</label><input id="metricBeidou" type="text" maxlength="100" placeholder="请输入北斗指标"></div></div></form></div><div class="dialog-actions"><button id="metricCancel" class="secondary">取消</button><button id="metricSave" class="primary">保存</button></div></dialog></body></html>

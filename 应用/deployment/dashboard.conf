server {
    listen 443 ssl;
    server_name 129.226.194.82;
    ssl_certificate /etc/letsencrypt/live/dashboard-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8k;
    location = / { return 302 /dashboard/; }
    location = /dashboard { return 302 /dashboard/; }
    location /dashboard/ {
        proxy_pass http://127.0.0.1:8321;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / { return 404; }
}
